services:
  - type: web
    name: growpros
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 app:app
    autoDeploy: true
    envVars:
      - key: GROWPROS_PUBLIC
        value: "1"
      - key: GROWPROS_DB_PATH
        value: /tmp/growpros.sqlite3
      - key: STUDYSYNC_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
