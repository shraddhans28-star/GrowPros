services:
  - type: web
    name: growpros
    runtime: python
    plan: 0.5c-512mb
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 app:app
    autoDeploy: true
    disk:
      name: growpros-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: GROWPROS_PUBLIC
        value: "1"
      - key: GROWPROS_DB_PATH
        value: /var/data/growpros.sqlite3
      - key: STUDYSYNC_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
